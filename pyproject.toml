[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.5.0,<3.0.0"]

[dependency-groups]
dev = [
  "black>=26.10.1",
  "coverage>=7.16.2",
  "pytest-mock>=3.17.0",
  "pytest>=9.1.1",
  "ruff>=0.17.1",
  "sort-all>=1.3.0",
  "toml-sort>=0.25.0",
]

[project]
authors = [{ email = "github@ovsds.ru", name = "ovsds" }]
dependencies = [
  "click>=8.5.0,<9.0.0",
  "lazy-object-proxy>=1.13.0,<2.0.0",
  "pydantic>=2.14.1,<3.0.0",
  "python-dotenv>=1.2.4,<2.0.0",
  "pyyaml>=6.0.3,<7.0.0",
]
description = "Yaml-based secret manager for secret load/set/clean."
keywords = ["secret", "transfer", "yaml"]
license = "MIT"
name = "secret-transfer"
readme = "README.md"
requires-python = ">=3.11"
version = "0.4.0"

[project.scripts]
secret-transfer = "secret_transfer.cli:main"

[project.urls]
repository = "https://github.com/ovsds/secret-transfer"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.coverage.report]
exclude_lines = [
  "@(abc\\.)?abstractmethod",
  "class .*Protocol\\):",
  "def __repr__",
  "if __name__ == .__main__.:",
  "if typing.TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.pyright]
exclude = ["**/__pycache__"]
include = ["secret_transfer", "tests"]
pythonPlatform = "All"
pythonVersion = "3.11"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "none"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
venv = ".venv"
venvPath = '.'

[tool.pytest.ini_options]
log_cli = true
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "[%(asctime)s][%(levelname)s][%(name)s][%(pathname)s:%(lineno)d] %(message)s"
log_level = "WARNING"
pythonpath = "."

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
  "I", # isort
  "UP", # pyupgrade
]
ignore = [
  "PLR0402", # manual-from-import, conflicts with `import a.b.c as c` module imports
  "RUF022", # unsorted-dunder-all, conflicts with sort-all ordering
  "TRY004", # type-check-without-type-error, keeps ValueError of the public validation API
]

[tool.tomlsort]
all = true
ignore_case = true
in_place = true
trailing_comma_inline_array = true
